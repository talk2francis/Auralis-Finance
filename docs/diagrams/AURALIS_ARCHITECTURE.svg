<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1460" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFBF9"/>
      <stop offset="1" stop-color="#F2F3F0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0B1220" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#0E9E8C"/>
    </marker>
  </defs>

  <rect width="1180" height="1460" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="62" font-size="30" font-weight="700" fill="#0B1220">Auralis Finance — System Architecture</text>
  <text x="60" y="90" font-size="15" fill="#5B6472">The AI risk &amp; compliance layer for tokenized real-world assets · Mantle Mainnet (chainId 5000)</text>
  <rect x="60" y="104" width="64" height="4" rx="2" fill="#0E9E8C"/>

  <!-- ===== LAYER 1 · CLIENT ===== -->
  <g filter="url(#sh)">
    <rect x="60" y="140" width="1060" height="150" rx="14" fill="#0B1220"/>
  </g>
  <text x="84" y="170" font-size="13" font-weight="700" fill="#0E9E8C" letter-spacing="1.5">LAYER 1 · CLIENT</text>
  <text x="84" y="192" font-size="15" fill="#AEB6C2">Next.js 15 App Router on Vercel — Marketing site (public) + App (wallet-gated)</text>
  <g font-size="12.5" fill="#0B1220">
    <rect x="84" y="210" width="190" height="58" rx="9" fill="#EAF6F4"/><text x="100" y="234" font-weight="600">Marketing site</text><text x="100" y="252" fill="#5B6472">/ · /ratings · /docs</text>
    <rect x="290" y="210" width="190" height="58" rx="9" fill="#EAF6F4"/><text x="306" y="234" font-weight="600">App surfaces</text><text x="306" y="252" fill="#5B6472">dashboard · simulator …</text>
    <rect x="496" y="210" width="190" height="58" rx="9" fill="#EAF6F4"/><text x="512" y="234" font-weight="600">wagmi 2 / viem 2</text><text x="512" y="252" fill="#5B6472">RainbowKit · SIWE</text>
    <rect x="702" y="210" width="190" height="58" rx="9" fill="#EAF6F4"/><text x="718" y="234" font-weight="600">Copilot widget</text><text x="718" y="252" fill="#5B6472">streaming · ⌘K palette</text>
    <rect x="908" y="210" width="188" height="58" rx="9" fill="#EAF6F4"/><text x="924" y="234" font-weight="600">Framer Motion</text><text x="924" y="252" fill="#5B6472">Recharts · shadcn/ui</text>
  </g>

  <!-- arrow 1->2 -->
  <line x1="590" y1="290" x2="590" y2="322" stroke="#0E9E8C" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="604" y="312" font-size="11.5" fill="#5B6472">HTTPS / SSE  ·  user-signed tx only</text>

  <!-- ===== LAYER 2 · API ===== -->
  <g filter="url(#sh)"><rect x="60" y="328" width="1060" height="118" rx="14" fill="#FFFFFF" stroke="#E4E6E2"/></g>
  <text x="84" y="356" font-size="13" font-weight="700" fill="#0E9E8C" letter-spacing="1.5">LAYER 2 · API &amp; ORCHESTRATION</text>
  <text x="84" y="377" font-size="14" fill="#5B6472">Next.js Route Handlers (Vercel serverless) — no separate API server</text>
  <g font-size="12.5" fill="#0B1220">
    <rect x="84" y="392" width="240" height="38" rx="9" fill="#F4F5F3"/><text x="100" y="416" font-weight="600">SIWE auth · session</text>
    <rect x="340" y="392" width="240" height="38" rx="9" fill="#F4F5F3"/><text x="356" y="416" font-weight="600">Zod-validated I/O</text>
    <rect x="596" y="392" width="240" height="38" rx="9" fill="#F4F5F3"/><text x="612" y="416" font-weight="600">Job orchestration</text>
    <rect x="852" y="392" width="244" height="38" rx="9" fill="#F4F5F3"/><text x="868" y="416" font-weight="600">Rate limits · caching</text>
  </g>

  <line x1="590" y1="446" x2="590" y2="478" stroke="#0E9E8C" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ===== LAYER 3 · INTELLIGENCE CORE ===== -->
  <g filter="url(#sh)"><rect x="60" y="484" width="1060" height="162" rx="14" fill="#FFFFFF" stroke="#0E9E8C" stroke-width="2"/></g>
  <text x="84" y="512" font-size="13" font-weight="700" fill="#0E9E8C" letter-spacing="1.5">LAYER 3 · INTELLIGENCE CORE</text>
  <text x="84" y="533" font-size="14" fill="#5B6472">Pure, testable, deterministic-fed modules — AI explains, deterministic code decides</text>
  <g font-size="12.5">
    <rect x="84" y="548" width="238" height="80" rx="10" fill="#0B1220"/>
    <text x="100" y="574" font-size="13.5" font-weight="700" fill="#FFFFFF">Rating Engine</text>
    <text x="100" y="594" fill="#AEB6C2">7-dimension risk model</text>
    <text x="100" y="612" fill="#AEB6C2">→ AAA…C + risk score</text>

    <rect x="338" y="548" width="238" height="80" rx="10" fill="#0B1220"/>
    <text x="354" y="574" font-size="13.5" font-weight="700" fill="#FFFFFF">Compliance Engine</text>
    <text x="354" y="594" fill="#AEB6C2">wallet screen + per-asset</text>
    <text x="354" y="612" fill="#AEB6C2">eligibility verdicts</text>

    <rect x="592" y="548" width="238" height="80" rx="10" fill="#0B1220"/>
    <text x="608" y="574" font-size="13.5" font-weight="700" fill="#FFFFFF">Portfolio Agent</text>
    <text x="608" y="594" fill="#AEB6C2">propose · simulate</text>
    <text x="608" y="612" fill="#AEB6C2">+ Policy Engine guardrails</text>

    <rect x="846" y="548" width="250" height="80" rx="10" fill="#0B1220"/>
    <text x="862" y="574" font-size="13.5" font-weight="700" fill="#FFFFFF">AI Reasoning Service</text>
    <text x="862" y="594" fill="#AEB6C2">schema-constrained (Zod)</text>
    <text x="862" y="612" fill="#AEB6C2">Elfa AI / OpenAI · cached</text>
  </g>

  <line x1="590" y1="646" x2="590" y2="678" stroke="#0E9E8C" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ===== LAYER 4 · DATA ADAPTERS ===== -->
  <g filter="url(#sh)"><rect x="60" y="684" width="1060" height="118" rx="14" fill="#FFFFFF" stroke="#E4E6E2"/></g>
  <text x="84" y="712" font-size="13" font-weight="700" fill="#0E9E8C" letter-spacing="1.5">LAYER 4 · DATA ADAPTERS — normalizers</text>
  <g font-size="12.5" fill="#0B1220">
    <rect x="84" y="728" width="240" height="56" rx="9" fill="#EAF6F4"/><text x="100" y="751" font-weight="600">Mantle asset adapters</text><text x="100" y="769" fill="#5B6472">USDY·QCDT·mETH·USDe·MI4</text>
    <rect x="340" y="728" width="240" height="56" rx="9" fill="#EAF6F4"/><text x="356" y="751" font-weight="600">Price &amp; TVL adapter</text><text x="356" y="769" fill="#5B6472">DefiLlama · CoinGecko</text>
    <rect x="596" y="728" width="240" height="56" rx="9" fill="#EAF6F4"/><text x="612" y="751" font-weight="600">Sanctions / jurisdiction</text><text x="612" y="769" fill="#5B6472">public lists · Nansen API</text>
    <rect x="852" y="728" width="244" height="56" rx="9" fill="#EAF6F4"/><text x="868" y="751" font-weight="600">Oracle-freshness</text><text x="868" y="769" fill="#5B6472">attestation staleness</text>
  </g>

  <line x1="400" y1="802" x2="400" y2="834" stroke="#0E9E8C" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="800" y1="802" x2="800" y2="834" stroke="#0E9E8C" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ===== LAYER 5 · MANTLE ON-CHAIN ===== -->
  <g filter="url(#sh)"><rect x="60" y="840" width="700" height="200" rx="14" fill="#0B1220"/></g>
  <text x="84" y="868" font-size="13" font-weight="700" fill="#0E9E8C" letter-spacing="1.5">LAYER 5 · MANTLE MAINNET — chainId 5000</text>
  <text x="84" y="889" font-size="13.5" fill="#AEB6C2">4 minimal contracts — store proofs, never funds · verified on Mantle Explorer</text>
  <g font-size="12">
    <rect x="84" y="904" width="316" height="56" rx="9" fill="#16203A"/><text x="100" y="927" font-weight="700" fill="#FFFFFF">AuralisRatingRegistry</text><text x="100" y="945" fill="#8C97A8">rating hashes · decision log</text>
    <rect x="416" y="904" width="316" height="56" rx="9" fill="#16203A"/><text x="432" y="927" font-weight="700" fill="#FFFFFF">AuralisComplianceAttestor</text><text x="432" y="945" fill="#8C97A8">privacy-preserving attestations</text>
    <rect x="84" y="968" width="316" height="56" rx="9" fill="#16203A"/><text x="100" y="991" font-weight="700" fill="#FFFFFF">AuralisAgentRegistry</text><text x="100" y="1009" fill="#8C97A8">ERC-8004 identity + reputation</text>
    <rect x="416" y="968" width="316" height="56" rx="9" fill="#16203A"/><text x="432" y="991" font-weight="700" fill="#FFFFFF">AuralisPolicyGuard</text><text x="432" y="1009" fill="#8C97A8">reverts on guardrail breach</text>
  </g>

  <!-- ===== LAYER 6 · STORAGE & CACHE ===== -->
  <g filter="url(#sh)"><rect x="784" y="840" width="336" height="200" rx="14" fill="#FFFFFF" stroke="#E4E6E2"/></g>
  <text x="808" y="868" font-size="13" font-weight="700" fill="#0E9E8C" letter-spacing="1.5">LAYER 6 · STORAGE</text>
  <g font-size="12.5" fill="#0B1220">
    <rect x="808" y="884" width="288" height="68" rx="9" fill="#F4F5F3"/>
    <text x="824" y="908" font-weight="700">Supabase Postgres</text>
    <text x="824" y="928" fill="#5B6472">jobs · ratings · attestations</text>
    <text x="824" y="944" fill="#5B6472">portfolios · decision records</text>
    <rect x="808" y="960" width="288" height="64" rx="9" fill="#F4F5F3"/>
    <text x="824" y="984" font-weight="700">Upstash Redis</text>
    <text x="824" y="1003" fill="#5B6472">RPC + AI cache · rate-limit</text>
    <text x="824" y="1019" fill="#5B6472">dedupe keys</text>
  </g>

  <!-- arrows to layer 7 -->
  <line x1="410" y1="1040" x2="410" y2="1086" stroke="#0E9E8C" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="952" y1="1040" x2="952" y2="1086" stroke="#0E9E8C" stroke-width="2.5"/>
  <line x1="952" y1="1086" x2="740" y2="1086" stroke="#0E9E8C" stroke-width="2.5"/>

  <!-- ===== LAYER 7 · WORKER ===== -->
  <g filter="url(#sh)"><rect x="60" y="1092" width="1060" height="116" rx="14" fill="#FFFFFF" stroke="#D9870B" stroke-width="2"/></g>
  <text x="84" y="1120" font-size="13" font-weight="700" fill="#D9870B" letter-spacing="1.5">LAYER 7 · LIGHT WORKER — your VPS</text>
  <text x="84" y="1142" font-size="14" fill="#5B6472">Single read-only refresh job · 15-min interval · idempotent · per-run hard cap</text>
  <g font-size="12.5" fill="#0B1220">
    <rect x="84" y="1156" width="320" height="38" rx="9" fill="#FBF1DE"/><text x="100" y="1180" font-weight="600">Pull asset state → recompute ratings</text>
    <rect x="420" y="1156" width="300" height="38" rx="9" fill="#FBF1DE"/><text x="436" y="1180" font-weight="600">Write to Postgres only</text>
  </g>
  <rect x="736" y="1156" width="360" height="38" rx="9" fill="#FDE8E9"/>
  <text x="752" y="1180" font-size="12.5" font-weight="700" fill="#D64550">NO private key · NO signing · NO loops</text>

  <!-- ===== SAFETY BANNER ===== -->
  <g filter="url(#sh)"><rect x="60" y="1238" width="1060" height="166" rx="14" fill="#0B1220"/></g>
  <text x="84" y="1268" font-size="14" font-weight="700" fill="#0E9E8C" letter-spacing="1.2">NON-CUSTODIAL &amp; ANTI-RUNAWAY GUARANTEE</text>
  <g font-size="13" fill="#D7DCE3">
    <text x="84" y="1296">1 · Exactly one private key exists — the deployer key — used once, locally, then removed from every environment.</text>
    <text x="84" y="1320">2 · No autonomous execution: every on-chain write is a user-signed transaction. The agent never holds keys.</text>
    <text x="84" y="1344">3 · No auto-deploy loops · no tight crons · CI runs lint/test only and never deploys.</text>
    <text x="84" y="1368">4 · Every external call cached &amp; rate-limited. Worst-case failure = 15-minute-stale data, never lost funds.</text>
    <text x="84" y="1392" fill="#0E9E8C" font-weight="600">Flow: Observe → Rate → Verify → Simulate → Approve → Execute (user-signed) → Prove on Mantle.</text>
  </g>
</svg>
